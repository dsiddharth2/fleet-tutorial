[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tui-calc"
version = "0.1.0"
description = "A terminal calculator with interactive TUI using Textual"
requires-python = ">=3.10"
dependencies = [
    "textual>=0.80",
]

[project.scripts]
tui-calc = "tui_calc.app:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "textual-dev>=0.80",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tui_calc"]
